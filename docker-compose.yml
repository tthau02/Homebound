version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: virtual_bus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bus_admin
      POSTGRES_PASSWORD: bus_password_2026
      POSTGRES_DB: virtual_bus_db
    ports:
      - '5432:5432'
    volumes:
      - virtual_bus_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: virtual_bus_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - virtual_bus_redisdata:/data

volumes:
  virtual_bus_pgdata:
  virtual_bus_redisdata:
